[coverage:run]
branch = True
cover_pylib = False
source = tubeupac
omit =
    tests/*
    .ci/*
    setup.py

[coverage:report]
show_missing = True

[flake8]
max-line-length = 120
exclude = tests/constants.py,.venv,build,dist

[options]
zip_safe = False
packages = find:
include_package_data = True

[options.packages.find]
exclude =
    tests
    tests.*

[tool:pytest]
testpaths = tests
addopts = -m "not network"
markers =
    network: hits real YouTube/archive.org; excluded by default, run with `pytest -m network`
